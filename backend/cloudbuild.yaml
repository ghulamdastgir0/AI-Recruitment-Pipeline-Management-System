steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rms-backend
      - --source=backend
      - --region=asia-southeast1
      - --allow-unauthenticated
      - --memory=1Gi
      - --timeout=3600
      - --min-instances=0
      - --max-instances=2
      - --set-env-vars=NODE_ENV=production,GCS_BUCKET_NAME=ai-recuritment-pipeline-internship26-gd,CORS_ORIGIN=https://rms-frontend-397963581210.asia-southeast1.run.app,PUBLIC_APP_URL=https://rms-frontend-397963581210.asia-southeast1.run.app,GROQ_API_URL=https://api.groq.com/openai/v1/chat/completions,GROQ_CV_PARSER_MODEL=openai/gpt-oss-20b,JWT_EXPIRES_IN=8h,BREVO_SENDER_EMAIL=ghulamdastgir1295@gmail.com,BREVO_SENDER_NAME=AI Recruitment Pipeline,GROQ_STT_API_URL=https://api.groq.com/openai/v1/audio/transcriptions,GROQ_STT_MODEL=whisper-large-v3-turbo,GROQ_TTS_API_URL=https://api.groq.com/openai/v1/audio/speech,GROQ_TTS_MODEL=canopylabs/orpheus-v1-english,GROQ_TTS_VOICE=troy,GEMINI_MODEL=gemini-3.6-flash
      - --set-secrets=DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,GROQ_API_KEY=groq-api-key:latest,SMTP_API=smtp-api:latest,GEMINI_API_KEY=gemini-api-key:latest
options:
  logging: CLOUD_LOGGING_ONLY
